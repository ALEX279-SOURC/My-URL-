<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener & Aesthetic Flashcard QR</title>
  <!-- Fast QR Code Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <!-- Google Aesthetic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 28px 22px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    h2 {
      color: #2d3748;
      font-size: 22px;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #718096;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="url"],
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus,
    input[type="text"]:focus {
      border-color: #667eea;
    }

    button.shorten-btn {
      padding: 13px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s, transform 0.1s;
    }

    button.shorten-btn:hover {
      background: #5a67d8;
    }

    button.shorten-btn:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    /* Result */
    .result-box {
      margin-top: 22px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .short-url-pill {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 10px;
      width: 100%;
      word-break: break-all;
    }

    .short-url-pill a {
      color: #3182ce;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 13px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .copy-btn { background: #38a169; color: white; }
    .copy-btn:hover { background: #2f855a; }

    .open-btn { background: #3182ce; color: white; }
    .open-btn:hover { background: #2b6cb0; }

    .download-btn { background: #c57d87; color: white; }
    .download-btn:hover { background: #b06973; }

    .share-btn { background: #4a5568; color: white; }
    .share-btn:hover { background: #2d3748; }

    /* Flashcard Preview */
    .card-preview-wrapper {
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.15));
      margin-top: 8px;
    }

    #cardCanvas {
      width: 260px;
      height: 440px;
      border-radius: 18px;
      display: block;
    }

    .error-msg {
      color: #e53e3e;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }

    /* History */
    .history-box {
      margin-top: 24px;
      text-align: left;
      border-top: 1px solid #edf2f7;
      padding-top: 15px;
      display: none;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .history-header h4 {
      font-size: 12px;
      text-transform: uppercase;
      color: #718096;
    }

    .clear-history-btn {
      background: none;
      border: none;
      color: #e53e3e;
      font-size: 12px;
      cursor: pointer;
    }

    .history-list {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
    }

    .history-item {
      padding: 8px 10px;
      background: #f7fafc;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item a {
      color: #4a5568;
      text-decoration: none;
    }

    .history-item a:hover {
      color: #667eea;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>URL Shortener</h2>
    <p class="subtitle">Lamba link daalo, custom short link aur Flashcard QR pao</p>

    <div class="input-box">
      <input type="url" id="longUrl" placeholder="Paste long URL (e.g. https://...)" required />
      <input type="text" id="customAlias" placeholder="Custom name e.g. ipchat (optional)" />
      <!-- New QR Subtitle / Description Input -->
      <input type="text" id="qrDesc" placeholder="QR Description e.g. @yourid or Project Notes (optional)" />
      
      <button class="shorten-btn" id="shortenBtn" onclick="shortenUrl()">Shorten URL</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <!-- Result -->
    <div class="result-box" id="resultBox">
      <div class="short-url-pill">
        <a href="#" target="_blank" id="shortUrlLink"></a>
      </div>

      <div class="action-buttons">
        <button class="btn copy-btn" id="copyBtn" onclick="copyLink()">📋 Copy Link</button>
        <a href="#" target="_blank" class="btn open-btn" id="openBtn">↗ Open</a>
        <button class="btn download-btn" onclick="downloadFlashCard()">⬇ Download Card</button>
        <button class="btn share-btn" onclick="shareFlashCard()">🔗 Share Card</button>
      </div>

      <!-- Canvas Flashcard -->
      <div class="card-preview-wrapper">
        <canvas id="cardCanvas"></canvas>
      </div>
    </div>

    <!-- History -->
    <div class="history-box" id="historyBox">
      <div class="history-header">
        <h4>Recent Links</h4>
        <button class="clear-history-btn" onclick="clearHistory()">Clear</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <script>
    let currentShortUrl = "";
    let currentDescText = "";

    window.onload = () => {
      document.fonts.ready.then(() => renderHistory());
    };

    function forceHttps(url) {
      if (!url) return "";
      let res = url.trim();
      if (res.startsWith("http://")) {
        res = "https://" + res.substring(7);
      } else if (!res.startsWith("https://")) {
        res = "https://" + res;
      }
      return res;
    }

    async function shortenUrl() {
      const urlInput = document.getElementById("longUrl");
      const aliasInput = document.getElementById("customAlias");
      const descInput = document.getElementById("qrDesc");
      const shortenBtn = document.getElementById("shortenBtn");
      const resultBox = document.getElementById("resultBox");
      const errorMsg = document.getElementById("errorMsg");

      const longUrl = urlInput.value.trim();
      const customAlias = aliasInput.value.trim().replace(/[^a-zA-Z0-9-_]/g, "");
      currentDescText = descInput.value.trim();

      errorMsg.style.display = "none";
      resultBox.style.display = "none";

      if (!longUrl) {
        showError("Kripya ek valid URL enter karein!");
        return;
      }

      const finalUrl = forceHttps(longUrl);

      shortenBtn.innerText = "Shortening...";
      shortenBtn.disabled = true;

      try {
        let createdUrl = null;

        // 1. Spoo.me API (Reliable CORS + Alias)
        try {
          let formData = new URLSearchParams();
          formData.append("url", finalUrl);
          if (customAlias) {
            formData.append("alias", customAlias);
          }

          const spooRes = await fetch("https://spoo.me/", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              "Accept": "application/json"
            },
            body: formData.toString()
          });

          const spooData = await spooRes.json();
          if (spooData.short_url) {
            createdUrl = forceHttps(spooData.short_url);
          } else if (spooData.error) {
            throw new Error(spooData.error);
          }
        } catch (e) {
          if (customAlias && e.message && e.message.toLowerCase().includes("alias")) {
            throw new Error(`Naam '${customAlias}' already liya ja chuka hai. Dusra try karein.`);
          }
        }

        // 2. Fallback to is.gd via CORS proxy
        if (!createdUrl) {
          let isGdUrl = `https://is.gd/create.php?format=json&url=${encodeURIComponent(finalUrl)}`;
          if (customAlias) {
            isGdUrl += `&shorturl=${encodeURIComponent(customAlias)}`;
          }

          const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(isGdUrl)}`);
          const data = await res.json();
          const parsed = JSON.parse(data.contents);

          if (parsed.shorturl) {
            createdUrl = forceHttps(parsed.shorturl);
          } else if (parsed.errormessage) {
            throw new Error(parsed.errormessage);
          }
        }

        if (createdUrl) {
          displayAll(createdUrl);
        } else {
          throw new Error("Unable to shorten url");
        }

      } catch (err) {
        showError(err.message || "Link create karne me dikkat aayi. Ek baar internet ya URL check karein.");
      } finally {
        shortenBtn.innerText = "Shorten URL";
        shortenBtn.disabled = false;
      }
    }

    async function displayAll(url) {
      currentShortUrl = forceHttps(url);
      document.getElementById("shortUrlLink").href = currentShortUrl;
      document.getElementById("shortUrlLink").innerText = currentShortUrl;
      document.getElementById("openBtn").href = currentShortUrl;

      await drawAestheticFlashCard(currentShortUrl, currentDescText);

      document.getElementById("resultBox").style.display = "flex";
      saveToHistory(currentShortUrl);
    }

    function drawAestheticFlashCard(url, customDesc) {
      return new Promise((resolve) => {
        const canvas = document.getElementById("cardCanvas");
        const ctx = canvas.getContext("2d");

        const W = 600;
        const H = 1000;
        canvas.width = W;
        canvas.height = H;

        // Dusty Rose background
        ctx.fillStyle = "#cb898f";
        roundRect(ctx, 0, 0, W, H, 40, true, false);

        // Stylish Title "My QR"
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.font = "bold 92px 'Caveat', cursive, sans-serif";
        ctx.fillText("My QR", W / 2, 145);

        // Subtitle "SCAN TO OPEN"
        ctx.font = "600 22px 'Poppins', sans-serif";
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fillText("SCAN TO OPEN", W / 2, 195);

        // Heart doodle
        drawHeart(ctx, W / 2 + 155, 210, 26);

        // Custom Description text under SCAN TO OPEN (if provided)
        let plateY = 275;
        if (customDesc) {
          ctx.font = "500 20px 'Poppins', sans-serif";
          ctx.fillStyle = "#ffffff";
          
          // Truncate if user enters very long string
          let displayText = customDesc.length > 30 ? customDesc.substring(0, 28) + "..." : customDesc;
          
          // Text pill background
          const textMetrics = ctx.measureText(displayText);
          const pillW = textMetrics.width + 30;
          const pillH = 34;
          const pillX = (W - pillW) / 2;
          const pillY = 220;

          ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
          roundRect(ctx, pillX, pillY, pillW, pillH, 17, true, false);

          ctx.fillStyle = "#ffffff";
          ctx.fillText(displayText, W / 2, pillY + 24);
          plateY = 275;
        }

        // White backplate for scanning
        const plateSize = 430;
        const plateX = (W - plateSize) / 2;
        ctx.fillStyle = "#ffffff";
        roundRect(ctx, plateX, plateY, plateSize, plateSize, 26, true, false);

        // QR Code inside plate
        const qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();

        const moduleCount = qr.getModuleCount();
        const qrMargin = 2;
        const qrInnerSize = plateSize - 44;
        const cellSize = qrInnerSize / (moduleCount + qrMargin * 2);
        const startX = plateX + 22 + (qrMargin * cellSize);
        const startY = plateY + 22 + (qrMargin * cellSize);

        ctx.fillStyle = "#1a1a1a";
        for (let r = 0; r < moduleCount; r++) {
          for (let c = 0; c < moduleCount; c++) {
            if (qr.isDark(r, c)) {
              ctx.fillRect(startX + c * cellSize, startY + r * cellSize, cellSize + 0.3, cellSize + 0.3);
            }
          }
        }

        // Footer
        drawFooterIcons(ctx, W / 2, 785);
        resolve();
      });
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function drawHeart(ctx, x, y, size) {
      ctx.save();
      ctx.beginPath();
      ctx.translate(x, y);
      ctx.rotate(-0.15);
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-size / 2, -size / 2, -size, size / 3, 0, size);
      ctx.bezierCurveTo(size, size / 3, size / 2, -size / 2, 0, 0);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";
      ctx.stroke();
      ctx.restore();
    }

    function drawFooterIcons(ctx, x, y) {
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      ctx.font = "600 24px 'Poppins', sans-serif";
      ctx.fillText("SHARE & CONNECT", x, y);

      ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
      ctx.font = "400 18px 'Poppins', sans-serif";
      ctx.fillText("Point your camera to scan instantly", x, y + 38);

      ctx.beginPath();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.moveTo(x - 140, y + 78);
      ctx.lineTo(x + 140, y + 78);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function downloadFlashCard() {
      const canvas = document.getElementById("cardCanvas");
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "My-QR-Flashcard.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function shareFlashCard() {
      if (!currentShortUrl) return;
      const canvas = document.getElementById("cardCanvas");

      if (navigator.share) {
        try {
          canvas.toBlob(async (blob) => {
            const file = new File([blob], "My-QR-Flashcard.png", { type: "image/png" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: "My QR Flashcard",
                text: `Scan QR code: ${currentShortUrl}`,
                files: [file]
              });
            } else {
              await navigator.share({
                title: "My QR",
                text: currentShortUrl,
                url: currentShortUrl
              });
            }
          });
        } catch (e) {
          copyLink();
        }
      } else {
        copyLink();
        alert("Link copy ho gaya hai!");
      }
    }

    function copyLink() {
      if (!currentShortUrl) return;
      const copyBtn = document.getElementById("copyBtn");
      navigator.clipboard.writeText(currentShortUrl).then(() => {
        copyBtn.innerText = "Copied! ✓";
        setTimeout(() => copyBtn.innerText = "📋 Copy Link", 2000);
      });
    }

    function showError(msg) {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.innerText = msg;
      errorMsg.style.display = "block";
    }

    function saveToHistory(url) {
      const secureUrl = forceHttps(url);
      let history = JSON.parse(localStorage.getItem("shortened_urls") || "[]");
      history = history.map(item => forceHttps(item));

      if (!history.includes(secureUrl)) {
        history.unshift(secureUrl);
        if (history.length > 5) history.pop();
        localStorage.setItem("shortened_urls", JSON.stringify(history));
      }
      renderHistory();
    }

    function renderHistory() {
      const historyBox = document.getElementById("historyBox");
      const historyList = document.getElementById("historyList");
      let history = JSON.parse(localStorage.getItem("shortened_urls") || "[]");

      if (history.length === 0) {
        historyBox.style.display = "none";
        return;
      }

      historyBox.style.display = "block";
      historyList.innerHTML = history.map(u => {
        const secureLink = forceHttps(u);
        return `
          <li class="history-item">
            <a href="${secureLink}" target="_blank">${secureLink}</a>
          </li>
        `;
      }).join("");
    }

    function clearHistory() {
      localStorage.removeItem("shortened_urls");
      renderHistory();
    }
  </script>
</body>
</html>
