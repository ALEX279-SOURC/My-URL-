<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick URL Shortener & QR</title>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    h2 {
      color: #2d3748;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #718096;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="url"] {
      width: 100%;
      padding: 13px 15px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: #667eea;
    }

    button.shorten-btn {
      padding: 13px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button.shorten-btn:hover {
      background: #5a67d8;
    }

    button.shorten-btn:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    /* Result Box */
    .result-box {
      margin-top: 22px;
      padding: 18px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .short-url-text {
      color: #2b6cb0;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      word-break: break-all;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .copy-btn {
      background: #48bb78;
      color: white;
    }
    .copy-btn:hover {
      background: #38a169;
    }

    .open-btn {
      background: #3182ce;
      color: white;
    }
    .open-btn:hover {
      background: #2b6cb0;
    }

    .download-btn {
      background: #805ad5;
      color: white;
    }
    .download-btn:hover {
      background: #6b46c1;
    }

    .share-btn {
      background: #ed8936;
      color: white;
    }
    .share-btn:hover {
      background: #dd6b20;
    }

    /* QR Section */
    #qrcode {
      padding: 10px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      display: flex;
      justify-content: center;
    }

    .error-msg {
      color: #e53e3e;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* History Section */
    .history-box {
      margin-top: 24px;
      text-align: left;
      border-top: 1px solid #edf2f7;
      padding-top: 15px;
      display: none;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .history-header h4 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #718096;
    }

    .clear-history-btn {
      background: none;
      border: none;
      color: #e53e3e;
      font-size: 12px;
      cursor: pointer;
    }

    .history-list {
      list-style: none;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-item {
      padding: 8px 10px;
      background: #f7fafc;
      border-radius: 6px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .history-item a {
      color: #4a5568;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 280px;
    }

    .history-item a:hover {
      color: #667eea;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>URL Shortener</h2>
    <p class="subtitle">Lamba link daalo, short link aur QR Code pao</p>

    <div class="input-box">
      <input type="url" id="longUrl" placeholder="https://example.com/bahut-bada-link" required />
      <button class="shorten-btn" id="shortenBtn" onclick="shortenUrl()">Shorten URL</button>
    </div>

    <!-- Error message -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- Result Box -->
    <div class="result-box" id="resultBox">
      <a href="#" target="_blank" class="short-url-text" id="shortUrlLink"></a>
      
      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="btn copy-btn" id="copyBtn" onclick="copyLink()">📋 Copy</button>
        <a href="#" target="_blank" class="btn open-btn" id="openBtn">↗ Open</a>
        <button class="btn download-btn" id="downloadBtn" onclick="downloadQRCode()">⬇ Download QR</button>
        <button class="btn share-btn" id="shareBtn" onclick="shareQRCode()">🔗 Share</button>
      </div>

      <!-- QR Code Output -->
      <div id="qrcode"></div>
    </div>

    <!-- Recent Links History -->
    <div class="history-box" id="historyBox">
      <div class="history-header">
        <h4>Recent Links</h4>
        <button class="clear-history-btn" onclick="clearHistory()">Clear</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <script>
    let currentShortUrl = "";

    window.onload = function() {
      renderHistory();
    };

    async function shortenUrl() {
      const urlInput = document.getElementById("longUrl");
      const shortenBtn = document.getElementById("shortenBtn");
      const resultBox = document.getElementById("resultBox");
      const errorMsg = document.getElementById("errorMsg");

      const longUrl = urlInput.value.trim();

      errorMsg.style.display = "none";
      resultBox.style.display = "none";

      if (!longUrl) {
        showError("Kripya ek valid URL enter karein!");
        return;
      }

      let finalUrl = longUrl;
      if (!longUrl.startsWith("http://") && !longUrl.startsWith("https://")) {
        finalUrl = "https://" + longUrl;
      }

      shortenBtn.innerText = "Shortening...";
      shortenBtn.disabled = true;

      try {
        const response = await fetch("https://api.tinyurl.com/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: finalUrl, domain: "tinyurl.com" })
        });

        if (!response.ok) {
          const fallbackRes = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(finalUrl)}`);
          const fallbackUrl = await fallbackRes.text();
          if (fallbackUrl && fallbackUrl.startsWith("http")) {
            showResult(fallbackUrl);
            saveToHistory(fallbackUrl);
            return;
          }
          throw new Error("TinyURL plain text failed");
        }

        const data = await response.json();
        if (data.data && data.data.tiny_url) {
          showResult(data.data.tiny_url);
          saveToHistory(data.data.tiny_url);
        } else {
          throw new Error("Invalid response format");
        }
      } catch (err) {
        try {
          const altRes = await fetch("https://spoo.me/", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              "Accept": "application/json"
            },
            body: `url=${encodeURIComponent(finalUrl)}`
          });
          const altData = await altRes.json();
          if (altData.short_url) {
            showResult(altData.short_url);
            saveToHistory(altData.short_url);
            return;
          }
        } catch (e) {
          // Fallback failed
        }
        showError("Link short nahi ho paya. URL ek baar check karein.");
      } finally {
        shortenBtn.innerText = "Shorten URL";
        shortenBtn.disabled = false;
      }
    }

    function showResult(url) {
      currentShortUrl = url;
      const shortUrlLink = document.getElementById("shortUrlLink");
      const openBtn = document.getElementById("openBtn");
      const resultBox = document.getElementById("resultBox");
      const qrcodeContainer = document.getElementById("qrcode");

      shortUrlLink.href = url;
      shortUrlLink.innerText = url;
      openBtn.href = url;

      // Draw QR Code
      qrcodeContainer.innerHTML = "";
      new QRCode(qrcodeContainer, {
        text: url,
        width: 140,
        height: 140,
        colorDark: "#1a202c",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      resultBox.style.display = "flex";
    }

    function copyLink() {
      if (!currentShortUrl) return;
      const copyBtn = document.getElementById("copyBtn");

      navigator.clipboard.writeText(currentShortUrl).then(() => {
        copyBtn.innerText = "Copied! ✓";
        copyBtn.style.background = "#2f855a";

        setTimeout(() => {
          copyBtn.innerText = "📋 Copy";
          copyBtn.style.background = "#48bb78";
        }, 2000);
      });
    }

    // Helper to extract image data from QR container
    function getQrImageDataUrl() {
      const img = document.querySelector("#qrcode img");
      if (img && img.src && img.src.startsWith("data:image")) {
        return img.src;
      }
      const canvas = document.querySelector("#qrcode canvas");
      if (canvas) {
        return canvas.toDataURL("image/png");
      }
      return null;
    }

    // 1. Download QR Code
    function downloadQRCode() {
      const dataUrl = getQrImageDataUrl();
      if (!dataUrl) {
        showError("QR code taiyar hone me samay lag raha hai. Ek second baad download karein.");
        return;
      }
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = "qrcode.png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // 2. Share QR & Link
    async function shareQRCode() {
      if (!currentShortUrl) return;

      const dataUrl = getQrImageDataUrl();

      if (navigator.share) {
        try {
          if (dataUrl) {
            // Blob conversion for direct image sharing
            const res = await fetch(dataUrl);
            const blob = await res.blob();
            const file = new File([blob], "qrcode.png", { type: "image/png" });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: "Shortened Link & QR Code",
                text: `Yeh raha aapka short link: ${currentShortUrl}`,
                url: currentShortUrl,
                files: [file]
              });
              return;
            }
          }

          // Fallback share if file sharing is not supported by device
          await navigator.share({
            title: "Shortened Link",
            text: `Yeh raha aapka link: ${currentShortUrl}`,
            url: currentShortUrl
          });
        } catch (err) {
          if (err.name !== "AbortError") {
            copyLink();
          }
        }
      } else {
        // Fallback for non-supported browsers
        copyLink();
        alert("Aapka link copy ho gaya hai! Aap ise direct paste karke share kar sakte hain.");
      }
    }

    function showError(message) {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.innerText = message;
      errorMsg.style.display = "block";
    }

    // Local Storage History Handlers
    function saveToHistory(url) {
      let history = JSON.parse(localStorage.getItem("shortened_urls") || "[]");
      if (!history.includes(url)) {
        history.unshift(url);
        if (history.length > 5) history.pop();
        localStorage.setItem("shortened_urls", JSON.stringify(history));
      }
      renderHistory();
    }

    function renderHistory() {
      const historyBox = document.getElementById("historyBox");
      const historyList = document.getElementById("historyList");
      const history = JSON.parse(localStorage.getItem("shortened_urls") || "[]");

      if (history.length === 0) {
        historyBox.style.display = "none";
        return;
      }

      historyBox.style.display = "block";
      historyList.innerHTML = history
        .map(
          item => `
          <li class="history-item">
            <a href="${item}" target="_blank">${item}</a>
          </li>`
        )
        .join("");
    }

    function clearHistory() {
      localStorage.removeItem("shortened_urls");
      renderHistory();
    }
  </script>
</body>
</html>
