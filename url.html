<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick URL Shortener</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    h2 {
      color: #333;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="url"] {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: #667eea;
    }

    button.shorten-btn {
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button.shorten-btn:hover {
      background: #5a67d8;
    }

    button.shorten-btn:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    /* Result Box */
    .result-box {
      margin-top: 25px;
      padding: 15px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .short-url-text {
      color: #2b6cb0;
      font-weight: 600;
      text-decoration: none;
      word-break: break-all;
      text-align: left;
    }

    .copy-btn {
      padding: 8px 14px;
      background: #48bb78;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: #38a169;
    }

    .error-msg {
      color: #e53e3e;
      font-size: 14px;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>URL Shortener</h2>
    <p class="subtitle">Lamba link daalo aur turant short link pao</p>

    <div class="input-box">
      <input type="url" id="longUrl" placeholder="https://example.com/bahut-bada-link" required />
      <button class="shorten-btn" id="shortenBtn" onclick="shortenUrl()">Shorten URL</button>
    </div>

    <!-- Error Message -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- Short URL Output -->
    <div class="result-box" id="resultBox">
      <a href="#" target="_blank" class="short-url-text" id="shortUrlLink"></a>
      <button class="copy-btn" id="copyBtn" onclick="copyLink()">Copy</button>
    </div>
  </div>

<script>
  async function shortenUrl() {
    const urlInput = document.getElementById("longUrl");
    const shortenBtn = document.getElementById("shortenBtn");
    const resultBox = document.getElementById("resultBox");
    const errorMsg = document.getElementById("errorMsg");
    const shortUrlLink = document.getElementById("shortUrlLink");

    const longUrl = urlInput.value.trim();

    // Reset UI
    errorMsg.style.display = "none";
    resultBox.style.display = "none";

    if (!longUrl) {
      showError("Kripya ek valid URL enter karein!");
      return;
    }

    let finalUrl = longUrl;
    if (!longUrl.startsWith("http://") && !longUrl.startsWith("https://")) {
      finalUrl = "https://" + longUrl;
    }

    shortenBtn.innerText = "Shortening...";
    shortenBtn.disabled = true;

    try {
      // Direct 301 instant redirect (bina kisi interstitial/preview page ke)
      const apiUrl = `https://ulvis.net/api.php?url=${encodeURIComponent(finalUrl)}&private=1`;
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;

      const response = await fetch(proxyUrl);
      if (!response.ok) throw new Error("Network issue");

      const data = await response.json();
      const shortUrl = data.contents.trim();

      if (shortUrl && shortUrl.startsWith("http")) {
        shortUrlLink.href = shortUrl;
        shortUrlLink.innerText = shortUrl;
        resultBox.style.display = "flex";
      } else {
        throw new Error("Short link nahi ban paya");
      }
    } catch (err) {
      showError("Dikkat aayi, kripya dobara koshish karein.");
    } finally {
      shortenBtn.innerText = "Shorten URL";
      shortenBtn.disabled = false;
    }
  }

  function copyLink() {
    const shortUrl = document.getElementById("shortUrlLink").innerText;
    const copyBtn = document.getElementById("copyBtn");

    navigator.clipboard.writeText(shortUrl).then(() => {
      copyBtn.innerText = "Copied! ✓";
      copyBtn.style.background = "#2f855a";

      setTimeout(() => {
        copyBtn.innerText = "Copy";
        copyBtn.style.background = "#48bb78";
      }, 2000);
    });
  }

  function showError(message) {
    const errorMsg = document.getElementById("errorMsg");
    errorMsg.innerText = message;
    errorMsg.style.display = "block";
  }
</script>

</body>
  </html>
