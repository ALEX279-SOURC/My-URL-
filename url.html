<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick URL Shortener & Flashcard QR</title>
  <!-- Fast & High Quality QR Engine -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      padding: 30px 22px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    h2 {
      color: #2d3748;
      font-size: 24px;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #718096;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .input-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="url"] {
      width: 100%;
      padding: 13px 15px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: #667eea;
    }

    button.shorten-btn {
      padding: 13px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button.shorten-btn:hover {
      background: #5a67d8;
    }

    button.shorten-btn:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    /* Result Box */
    .result-box {
      margin-top: 22px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .short-url-pill {
      background: #edf2f7;
      padding: 10px 14px;
      border-radius: 10px;
      width: 100%;
      word-break: break-all;
    }

    .short-url-pill a {
      color: #3182ce;
      font-weight: 600;
      text-decoration: none;
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 13px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .copy-btn { background: #38a169; color: white; }
    .copy-btn:hover { background: #2f855a; }

    .open-btn { background: #3182ce; color: white; }
    .open-btn:hover { background: #2b6cb0; }

    .download-btn { background: #805ad5; color: white; }
    .download-btn:hover { background: #6b46c1; }

    .share-btn { background: #dd6b20; color: white; }
    .share-btn:hover { background: #c05621; }

    /* Flashcard Design */
    .qr-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 18px 16px;
      width: 250px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .qr-card-header {
      font-size: 15px;
      font-weight: 700;
      color: #2d3748;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qr-card-header::before,
    .qr-card-header::after {
      content: "•";
      color: #667eea;
      font-size: 18px;
    }

    .qr-frame {
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      border: 2px dashed #cbd5e0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .qr-frame canvas {
      display: block;
      border-radius: 4px;
    }

    .qr-tagline {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 600;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .error-msg {
      color: #e53e3e;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    /* History */
    .history-box {
      margin-top: 24px;
      text-align: left;
      border-top: 1px solid #edf2f7;
      padding-top: 15px;
      display: none;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .history-header h4 {
      font-size: 12px;
      text-transform: uppercase;
      color: #718096;
    }

    .clear-history-btn {
      background: none;
      border: none;
      color: #e53e3e;
      font-size: 12px;
      cursor: pointer;
    }

    .history-list {
      list-style: none;
      max-height: 120px;
      overflow-y: auto;
    }

    .history-item {
      padding: 8px 10px;
      background: #f7fafc;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item a {
      color: #4a5568;
      text-decoration: none;
    }

    .history-item a:hover {
      color: #667eea;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>URL Shortener</h2>
    <p class="subtitle">Lamba link daalo, short link aur Flashcard QR pao</p>

    <div class="input-box">
      <input type="url" id="longUrl" placeholder="https://example.com/long-url" required />
      <button class="shorten-btn" id="shortenBtn" onclick="shortenUrl()">Shorten URL</button>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <!-- Result -->
    <div class="result-box" id="resultBox">
      
      <div class="short-url-pill">
        <a href="#" target="_blank" id="shortUrlLink"></a>
      </div>

      <div class="action-buttons">
        <button class="btn copy-btn" id="copyBtn" onclick="copyLink()">📋 Copy</button>
        <a href="#" target="_blank" class="btn open-btn" id="openBtn">↗ Open</a>
        <button class="btn download-btn" onclick="downloadQRCard()">⬇ Download</button>
        <button class="btn share-btn" onclick="shareQRCard()">🔗 Share</button>
      </div>

      <!-- Flashcard Format QR Code -->
      <div class="qr-card" id="qrFlashcard">
        <div class="qr-card-header">My QR</div>
        <div class="qr-frame">
          <canvas id="qrCanvas"></canvas>
        </div>
        <div class="qr-tagline">Scan Me</div>
      </div>

    </div>

    <!-- History -->
    <div class="history-box" id="historyBox">
      <div class="history-header">
        <h4>Recent Links</h4>
        <button class="clear-history-btn" onclick="clearHistory()">Clear</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </div>
  </div>

  <script>
    let currentShortUrl = "";

    window.onload = renderHistory;

    async function shortenUrl() {
      const urlInput = document.getElementById("longUrl");
      const shortenBtn = document.getElementById("shortenBtn");
      const resultBox = document.getElementById("resultBox");
      const errorMsg = document.getElementById("errorMsg");

      const longUrl = urlInput.value.trim();

      errorMsg.style.display = "none";
      resultBox.style.display = "none";

      if (!longUrl) {
        showError("Kripya ek valid URL enter karein!");
        return;
      }

      let finalUrl = longUrl;
      if (!longUrl.startsWith("http://") && !longUrl.startsWith("https://")) {
        finalUrl = "https://" + longUrl;
      }

      shortenBtn.innerText = "Shortening...";
      shortenBtn.disabled = true;

      try {
        const response = await fetch("https://api.tinyurl.com/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: finalUrl, domain: "tinyurl.com" })
        });

        if (!response.ok) {
          const fallbackRes = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(finalUrl)}`);
          const fallbackUrl = await fallbackRes.text();
          if (fallbackUrl && fallbackUrl.startsWith("http")) {
            displayAll(fallbackUrl);
            return;
          }
          throw new Error();
        }

        const data = await response.json();
        if (data.data && data.data.tiny_url) {
          displayAll(data.data.tiny_url);
        } else {
          throw new Error();
        }
      } catch (err) {
        try {
          const altRes = await fetch("https://spoo.me/", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              "Accept": "application/json"
            },
            body: `url=${encodeURIComponent(finalUrl)}`
          });
          const altData = await altRes.json();
          if (altData.short_url) {
            displayAll(altData.short_url);
            return;
          }
        } catch (e) {}
        showError("Link short nahi ho paya. Ek baar URL check karein.");
      } finally {
        shortenBtn.innerText = "Shorten URL";
        shortenBtn.disabled = false;
      }
    }

    function displayAll(url) {
      currentShortUrl = url;
      document.getElementById("shortUrlLink").href = url;
      document.getElementById("shortUrlLink").innerText = url;
      document.getElementById("openBtn").href = url;

      // Draw high-readability QR code with safe margins (Lens Scannable)
      renderCleanQR(url);

      document.getElementById("resultBox").style.display = "flex";
      saveToHistory(url);
    }

    // High scannability canvas renderer
    function renderCleanQR(text) {
      const qr = qrcode(0, 'M'); // M level is optimal for fast mobile scanning
      qr.addData(text);
      qr.make();

      const canvas = document.getElementById("qrCanvas");
      const ctx = canvas.getContext("2d");
      
      const moduleCount = qr.getModuleCount();
      const cellSize = 5; 
      const margin = 4; // Crucial for Google Lens to detect corner anchors
      const size = (moduleCount + 2 * margin) * cellSize;

      canvas.width = size;
      canvas.height = size;

      // Pure white quiet background
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);

      // Black modules
      ctx.fillStyle = "#000000";
      for (let r = 0; r < moduleCount; r++) {
        for (let c = 0; c < moduleCount; c++) {
          if (qr.isDark(r, c)) {
            ctx.fillRect((c + margin) * cellSize, (r + margin) * cellSize, cellSize, cellSize);
          }
        }
      }
    }

    function copyLink() {
      if (!currentShortUrl) return;
      const copyBtn = document.getElementById("copyBtn");
      navigator.clipboard.writeText(currentShortUrl).then(() => {
        copyBtn.innerText = "Copied! ✓";
        setTimeout(() => copyBtn.innerText = "📋 Copy", 2000);
      });
    }

    // Download QR Flashcard image
    function downloadQRCard() {
      const canvas = document.getElementById("qrCanvas");
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "My-QR.png";
      a.click();
    }

    // Native Share
    async function shareQRCard() {
      if (!currentShortUrl) return;
      const canvas = document.getElementById("qrCanvas");

      if (navigator.share) {
        try {
          canvas.toBlob(async (blob) => {
            const file = new File([blob], "My-QR.png", { type: "image/png" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: "My QR",
                text: `Scan QR or open link: ${currentShortUrl}`,
                url: currentShortUrl,
                files: [file]
              });
            } else {
              await navigator.share({
                title: "My QR",
                text: currentShortUrl,
                url: currentShortUrl
              });
            }
          });
        } catch (e) {
          copyLink();
        }
      } else {
        copyLink();
        alert("Link copy ho gaya hai!");
      }
    }

    function showError(msg) {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.innerText = msg;
      errorMsg.style.display = "block";
    }

    function saveToHistory(url) {
      let history = JSON.parse(localStorage.getItem("shortened_urls") || "[]");
      if (!history.includes(url)) {
        history.unshift(url);
        if (history.length > 5) history.pop();
        localStorage.setItem("shortened_urls", JSON.stringify(history));
      }
      renderHistory();
    }

    function renderHistory() {
      const historyBox = document.getElementById("historyBox");
      const historyList = document.getElementById("historyList");
      const history = JSON.parse(localStorage.getItem("shortened_urls") || "[]");

      if (history.length === 0) {
        historyBox.style.display = "none";
        return;
      }

      historyBox.style.display = "block";
      historyList.innerHTML = history.map(u => `
        <li class="history-item">
          <a href="${u}" target="_blank">${u}</a>
        </li>
      `).join("");
    }

    function clearHistory() {
      localStorage.removeItem("shortened_urls");
      renderHistory();
    }
  </script>
</body>
</html>
