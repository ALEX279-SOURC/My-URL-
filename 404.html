<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Link...</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    html, body {
      height: 100%;
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .loader {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      z-index: 9999;
    }
    .fallback-bar {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      z-index: 10000;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="loader" id="loader"></div>
  <p id="status">Link open ho raha hai...</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get, update, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC2NIycuv4ng7poajfrnVDoTd7kSnkEVFE",
      authDomain: "my-url-2db33.firebaseapp.com",
      databaseURL: "https://my-url-2db33-default-rtdb.firebaseio.com",
      projectId: "my-url-2db33",
      storageBucket: "my-url-2db33.firebasestorage.app",
      messagingSenderId: "1024392619396",
      appId: "1:1024392619396:web:d5c08d6f9563e9795ea9d1",
      measurementId: "G-3ZJRBTN616"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function handleRedirect() {
      const pathSegments = window.location.pathname.split("/").filter(Boolean);
      const code = pathSegments[pathSegments.length - 1];

      if (!code) {
        document.getElementById("loader").style.display = "none";
        document.getElementById("status").innerText = "Invalid URL!";
        return;
      }

      try {
        const linkRef = ref(db, `links/${code}`);
        const snapshot = await get(linkRef);

        if (!snapshot.exists()) {
          document.getElementById("loader").style.display = "none";
          document.getElementById("status").innerText = "404 - Ye short link exist nahi karta!";
          return;
        }

        const data = snapshot.val();

        // Click counter +1 karein
        update(linkRef, { clicks: increment(1) }).catch(() => {});

        if (data.mask) {
          // Address bar me short URL rakhne ke liye full-screen iframe
          document.body.innerHTML = `
            <iframe src="${data.url}" allowfullscreen></iframe>
            <a class="fallback-bar" href="${data.url}" target="_blank">Agar page load na ho to yahan click karein ↗</a>
          `;
        } else {
          // Normal fast redirect
          window.location.replace(data.url);
        }
      } catch (err) {
        document.getElementById("loader").style.display = "none";
        document.getElementById("status").innerText = "Error: Link load nahi ho saka.";
      }
    }

    handleRedirect();
  </script>
</body>
</html>
